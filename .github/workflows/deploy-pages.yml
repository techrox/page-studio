name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build showcase
        run: pnpm --filter @techrox/page-studio-example-showcase build

      # SPA fallback — GitHub Pages serves 404.html on unknown routes, and
      # BrowserRouter handles the path once index.html loads.
      - name: Add SPA 404 fallback
        run: cp examples/showcase/dist/index.html examples/showcase/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
